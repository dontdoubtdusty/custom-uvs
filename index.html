<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UVS Card Creator v0.02</title>
  <meta name="description" content="Make your own custom cards in the style of the UniVersus card game.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='4' width='18' height='24' rx='3' fill='%2324735F'/%3E%3Cpath d='M11 12h10M11 16h10M11 20h6' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="10" y="3" width="16" height="22" rx="2.5" transform="rotate(12 18 14)" class="brand-back"/>
        <rect x="6" y="6" width="16" height="22" rx="2.5" class="brand-front"/>
        <path d="M10 13h8M10 17h8M10 21h5" class="brand-lines"/>
      </svg>
      <h1>UVS Card Creator</h1>
      <span class="version">v0.02</span>
    </div>
    <p class="save-status" id="save-status" role="status" aria-live="polite"></p>
  </header>

  <div class="storage-banner" id="storage-banner" role="alert" hidden>
    This browser is blocking storage, so your cards are kept only until you close this tab.
  </div>

  <main class="workspace" id="workspace">
    <aside class="sidebar" id="sidebar" aria-label="Sets and cards" hidden></aside>
    <section class="mat" aria-label="Card preview">
      <div class="mat-inner">
        <div class="card-frame">
          <canvas id="card-canvas" class="card-canvas" width="750" height="1050" role="img" aria-label="Card preview"></canvas>
        </div>
        <p class="mat-hint" id="mat-hint" hidden>Drag the art to move it.</p>
      </div>
    </section>
    <section class="editor" id="editor" aria-label="Card editor">
      <p class="loading">Loading your sets</p>
    </section>
  </main>

  <noscript><p class="noscript">UVS Card Creator needs JavaScript turned on.</p></noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
